<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Audio Guía · Japón</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#f4ece0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: oklch(0.97 0.012 78);
      --paper-2: oklch(0.94 0.018 78);
      --card: oklch(0.985 0.008 78);
      --ink: oklch(0.22 0.018 50);
      --ink-soft: oklch(0.46 0.022 55);
      --ink-faint: oklch(0.62 0.018 60);
      --rule: oklch(0.88 0.02 70);
      --accent: oklch(0.52 0.13 38);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }
    button { font-family: inherit; }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    /* Mobile-first: cap width on tablet/desktop, center, paper edges */
    #root {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      background: var(--paper);
      box-shadow: 0 0 0 1px var(--rule);
    }
    /* On big screens show some breathing room */
    @media (min-width: 600px) {
      body { background: oklch(0.92 0.015 70); padding: 24px 0; }
      #root { box-shadow: 0 30px 80px -20px rgba(60,40,20,0.25), 0 1px 0 rgba(0,0,0,0.04); border-radius: 18px; overflow: hidden; min-height: calc(100dvh - 48px); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script src="transcripts.js"></script>
  <script type="text/babel" data-presets="react" src="components.jsx"></script>
  <script type="text/babel" data-presets="react" src="tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="react" src="screens.jsx"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
